<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32">
<!-- Nova Bomb: a round warhead pod with short fins and a white-hot core (not a star, so it can't be mistaken for a hit spark).
     Gear part, facing up (forward), about 12 units across. Five passes: outline, fill, shading, highlights, details.
     "#39ff14" is the tech's glow (swapped for its element colour); groups named fork_a / fork_b show with that fork. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M-6,3 L-3,0 L-3,5 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M-6,3 L-3,0 L-3,5 Z" fill="#55697d"/>
  <path d="M6,3 L3,0 L3,5 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M6,3 L3,0 L3,5 Z" fill="#3a4a5a"/>
  <circle cx="0" cy="0" r="5" fill="#0a1628"/>
  <circle cx="0" cy="0" r="4.1" fill="#55697d"/>
  <path d="M0.6,-4 A4.1,4.1 0 0 1 0.6,4 Z" fill="#3a4a5a"/>
  <path d="M-3.4,1.4 A3.6,3.6 0 0 1 -0.8,-3.3" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <circle cx="0" cy="0" r="2.5999999999999996" fill="#0a1628"/>
  <circle cx="0" cy="0" r="1.9" fill="#39ff14"/>
  <circle cx="-0.475" cy="-0.475" r="0.855" fill="#d8ffcc"/>
</g>
</svg>
