<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32">
<!-- Thruster Explosion: twin booster bells that flare when it fires.
     Gear part, facing up (forward), about 12 units across. Five passes: outline, fill, shading, highlights, details.
     "#39ff14" is the tech's glow (swapped for its element colour); groups named fork_a / fork_b show with that fork. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M-4.5,-7 L4.5,-7 L4.5,-2 L-4.5,-2 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M-4.5,-7 L4.5,-7 L4.5,-2 L-4.5,-2 Z" fill="#55697d"/>
  <path d="M0.8999999999999995,-7 L4.5,-7 L4.5,-2 L0.8999999999999995,-2 Z" fill="#3a4a5a"/>
  <path d="M-4.0,-2.5 L-4.0,-6.5 L0.0,-6.5" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <path d="M-4,-2 L-5.5,6 L-1,6 L-1.5,-2 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M-4,-2 L-5.5,6 L-1,6 L-1.5,-2 Z" fill="#55697d"/>
  <path d="M1.5,-2 L1,6 L5.5,6 L4,-2 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M1.5,-2 L1,6 L5.5,6 L4,-2 Z" fill="#3a4a5a"/>
  <path d="M-4.8,6.6 L-1.6,6.6 M1.6,6.6 L4.8,6.6" stroke="#ff9a3c" stroke-width="1.4"/>
</g>
</svg>
