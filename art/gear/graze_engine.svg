<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32">
<!-- Graze Engine: two swept vanes around a charge core.
     Gear part, facing up (forward), about 12 units across. Five passes: outline, fill, shading, highlights, details.
     "#39ff14" is the tech's glow (swapped for its element colour); groups named fork_a / fork_b show with that fork. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M0,4 L-7,-6 L-4,-6 L0,0 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M0,4 L-7,-6 L-4,-6 L0,0 Z" fill="#55697d"/>
  <path d="M-6.4,-5.6 L-0.4,3" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <path d="M0,4 L7,-6 L4,-6 L0,0 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.6"/>
  <path d="M0,4 L7,-6 L4,-6 L0,0 Z" fill="#3a4a5a"/>
  <circle cx="0" cy="4.5" r="2.5" fill="#0a1628"/>
  <circle cx="0" cy="4.5" r="1.8" fill="#39ff14"/>
  <circle cx="-0.45" cy="4.05" r="0.81" fill="#d8ffcc"/>
</g>
</svg>
