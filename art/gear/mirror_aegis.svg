<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32">
<!-- Mirror Aegis: a curved mirror plate. Bastion widens it into a wall.
     Gear part, facing up (forward), about 12 units across. Five passes: outline, fill, shading, highlights, details.
     "#39ff14" is the tech's glow (swapped for its element colour); groups named fork_a / fork_b show with that fork. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M-2,2 L2,2 L2,7 L-2,7 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.3"/>
  <path d="M-2,2 L2,2 L2,7 L-2,7 Z" fill="#55697d"/>
  <path d="M0.3999999999999999,2 L2,2 L2,7 L0.3999999999999999,7 Z" fill="#3a4a5a"/>
  <path d="M-1.5,6.5 L-1.5,2.5 L0.0,2.5" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <g id="plate">
  <path d="M-7,-1 Q0,-8 7,-1" stroke="#0a1628" stroke-width="4.4" fill="none"/>
  <path d="M-7,-1 Q0,-8 7,-1" stroke="#39ff14" stroke-width="2.4" fill="none"/>
  <path d="M-5,-2.6 Q-2,-5.4 0,-5" stroke="#d8ffcc" stroke-width="0.9" fill="none"/>
  </g>
  <g id="fork_b">
  <path d="M-11,1 Q0,-10 11,1" stroke="#0a1628" stroke-width="4.4" fill="none"/>
  <path d="M-11,1 Q0,-10 11,1" stroke="#39ff14" stroke-width="2.4" fill="none"/>
  </g>
</g>
</svg>
