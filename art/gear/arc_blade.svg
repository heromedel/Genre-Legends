<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32">
<!-- Arc Blade: a hilt and a glowing blade (stretched with level). Whirlwind adds a second blade; Phantom Edge a crescent.
     Gear part, facing up (forward), about 12 units across. Five passes: outline, fill, shading, highlights, details.
     "#39ff14" is the tech's glow (swapped for its element colour); groups named fork_a / fork_b show with that fork. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M-1.6,1 L1.6,1 L1.6,7 L-1.6,7 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.3"/>
  <path d="M-1.6,1 L1.6,1 L1.6,7 L-1.6,7 Z" fill="#55697d"/>
  <path d="M0.31999999999999984,1 L1.6,1 L1.6,7 L0.31999999999999984,7 Z" fill="#3a4a5a"/>
  <path d="M-1.1,6.5 L-1.1,1.5 L0.0,1.5" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <path d="M-4.5,-0.5 L4.5,-0.5 L4.5,1.5 L-4.5,1.5 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.2"/>
  <path d="M-4.5,-0.5 L4.5,-0.5 L4.5,1.5 L-4.5,1.5 Z" fill="#3a4a5a"/>
  <path d="M0.8999999999999995,-0.5 L4.5,-0.5 L4.5,1.5 L0.8999999999999995,1.5 Z" fill="#2a3644"/>
  <path d="M-4.0,1.0 L-4.0,0.0 L0.0,0.0" stroke="#b4c8da" stroke-width="0.8" fill="none"/>
  <g id="blade">
  <path d="M-1.3,-0.5 L0,-13 L1.3,-0.5 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.4"/>
  <path d="M-1.3,-0.5 L0,-13 L1.3,-0.5 Z" fill="#39ff14"/>
  <path d="M-0.4,-1 L0,-11" stroke="#d8ffcc" stroke-width="0.6"/>
  </g>
  <g id="fork_b">
  <path d="M-1.3,7 L0,16 L1.3,7 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.4"/>
  <path d="M-1.3,7 L0,16 L1.3,7 Z" fill="#39ff14"/>
  </g>
  <g id="fork_a">
  <path d="M-4,-10 Q0,-15 4,-10" stroke="#0a1628" stroke-width="2.6" fill="none"/>
  <path d="M-4,-10 Q0,-15 4,-10" stroke="#39ff14" stroke-width="1.2" fill="none"/>
  </g>
</g>
</svg>
