<!-- Outer hull -->
<path d="M-300,-30 L-220,-96 L220,-96 L300,-30 L270,40 L0,92 L-270,40 Z" fill="#070b14" stroke="#070b14" stroke-width="7"/>
<path d="M-300,-30 L-220,-96 L220,-96 L300,-30 L270,40 L0,92 L-270,40 Z" fill="#3c4a66"/>
<path d="M10,-96 L220,-96 L300,-30 L270,40 L10,90 Z" fill="#2c3850"/>
<path d="M-270,40 L0,92 L270,40 L262,24 L0,74 L-262,24 Z" fill="#1e2638"/>
<path d="M-296,-30 L-219,-92 L0,-92" stroke="#a8c4ec" stroke-width="4" fill="none"/>
<path d="M-292,-24 L-266,36" stroke="#7890b8" stroke-width="2.5" fill="none"/>
<path d="M-210,-90 L-200,30 M-70,-94 L-66,60 M70,-94 L66,60 M210,-90 L200,30 M-280,-6 L280,-6" stroke="#1e2638" stroke-width="2.5"/>
<g fill="#9ad9ff"><circle cx="-280" cy="-20" r="3.5"/><circle cx="280" cy="-20" r="3.5"/><circle cx="-250" cy="30" r="3"/><circle cx="250" cy="30" r="3"/></g>
<!-- Raised spine deck -->
<path d="M-240,-20 L-176,-74 L176,-74 L240,-20 L216,26 L0,60 L-216,26 Z" fill="#070b14" stroke="#070b14" stroke-width="5"/>
<path d="M-240,-20 L-176,-74 L176,-74 L240,-20 L216,26 L0,60 L-216,26 Z" fill="#4a5a7a"/>
