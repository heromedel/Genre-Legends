<!-- Engine block along the stern -->
<path d="M-150,-96 L-150,-112 L150,-112 L150,-96 Z" fill="#070b14" stroke="#070b14" stroke-width="6"/>
<path d="M-148,-98 L-148,-110 L148,-110 L148,-98 Z" fill="#2a3448"/>
