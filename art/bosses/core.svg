<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 160 160">
<!-- A boss core: an armoured ring around a white-hot heart. Shut, two shutters cover it and only a glowing seam
     shows; open, they slide apart. Shared by several bosses and recoloured to each (BossArt._core): #ff8a3a and
     #ffd08a are the heart, #6a5038 / #4a3826 / #e8d0b0 / #120c06 the armour. Radius 30, centred on the part.
     Light from the top-left. Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. -->
<g stroke-linejoin="round" stroke-linecap="round">
<circle cx="0" cy="0" r="33" fill="#120c06"/>
<circle cx="0" cy="0" r="30" fill="#6a5038"/>
<path d="M0,-30 A30,30 0 0 1 0,30 L0,22 A22,22 0 0 0 0,-22 Z" fill="#4a3826"/>
<path d="M-21,-20 A29,29 0 0 1 -4,-29" stroke="#e8d0b0" stroke-width="2.4" fill="none"/>
<g fill="#120c06"><circle cx="-26" cy="0" r="2.2"/><circle cx="26" cy="0" r="2.2"/><circle cx="0" cy="-26" r="2.2"/><circle cx="0" cy="26" r="2.2"/></g>
<circle cx="0" cy="0" r="22" fill="#120c06"/>
<g id="heart"><circle cx="0" cy="0" r="20" fill="#ff8a3a"/><circle cx="0" cy="0" r="14" fill="#ffd08a"/><circle cx="0" cy="0" r="8" fill="#ffffff"/><circle cx="-4" cy="-4" r="3" fill="#ffffff"/></g>
<g id="shutter_l">
  <path d="M-1,-23 L-20,-12 L-20,12 L-1,23 Z" fill="#120c06" stroke="#120c06" stroke-width="3"/>
  <path d="M-1,-23 L-20,-12 L-20,12 L-1,23 Z" fill="#6a5038"/>
  <path d="M-3,-20 L-18,-11 L-18,4" stroke="#e8d0b0" stroke-width="1.6" fill="none"/>
</g>
<g id="shutter_r">
  <path d="M1,-23 L20,-12 L20,12 L1,23 Z" fill="#120c06" stroke="#120c06" stroke-width="3"/>
  <path d="M1,-23 L20,-12 L20,12 L1,23 Z" fill="#4a3826"/>
</g>
<g id="seam"><rect x="-1.4" y="-20" width="2.8" height="40" rx="1.2" fill="#ffd08a"/></g>
</g>
</svg>
