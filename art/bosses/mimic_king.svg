<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 60 60">
<!-- The Mimic King: a great mimic chest, crowned, its lid gaping over a mouth full of teeth. Drawn at the
     enemy Mimic's size; BossArt scales it up. Facing up (toward where it flies), nominal radius 16, game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">
<g id="mouth"><path d="M-14,-6 L14,-6 L14,1 L-14,1 Z" fill="#4a0510"/></g>
<path d="M-16,0 L16,0 L16,14 L-16,14 Z" fill="#1f0f05" stroke="#1f0f05" stroke-width="2.4"/>
<path d="M-16,0 L16,0 L16,14 L-16,14 Z" fill="#8c5222"/>
<path d="M1,0 L16,0 L16,14 L1,14 Z" fill="#6a3a14"/>
<path d="M-16,5 L16,5" stroke="#ffcc4d" stroke-width="1.6"/>
<path d="M-12,0 L-10,-4 L-8,0 Z M-6,0 L-4,-4 L-2,0 Z M2,0 L4,-4 L6,0 Z M8,0 L10,-4 L12,0 Z" fill="#fffbe8"/>
<circle cx="0" cy="-2" r="2.2" fill="#ff6699"/>
<g id="lid">
  <path d="M-12,-6 L-10,-2 L-8,-6 Z M-5,-6 L-3,-2 L-1,-6 Z M1,-6 L3,-2 L5,-6 Z M8,-6 L10,-2 L12,-6 Z" fill="#fffbe8"/>
  <path d="M-16,-6 L-13,-17 L13,-17 L16,-6 Z" fill="#1f0f05" stroke="#1f0f05" stroke-width="2.4"/>
  <path d="M-16,-6 L-13,-17 L13,-17 L16,-6 Z" fill="#a8662c"/>
  <path d="M1,-17 L13,-17 L16,-6 L1,-6 Z" fill="#7a4618"/>
  <path d="M-14.6,-7 L-12.2,-16" stroke="#ffd9a6" stroke-width="1"/>
  <path d="M-15,-9 L15,-9" stroke="#ffcc4d" stroke-width="1.6"/>
  <path d="M-10,-17 L-8,-25 L-4,-20 L0,-27 L4,-20 L8,-25 L10,-17 Z" fill="#1f0f05" stroke="#1f0f05" stroke-width="1.6"/>
  <path d="M-10,-17 L-8,-25 L-4,-20 L0,-27 L4,-20 L8,-25 L10,-17 Z" fill="#ffcc4d"/>
  <path d="M0,-27 L4,-20 L8,-25 L10,-17 L0,-17 Z" fill="#d9a020"/>
  <circle cx="0" cy="-20" r="1.4" fill="#ff5a8c"/>
</g>
