<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Vanguard, mech form, seen from directly above, facing up. Game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front.
     Gear mounts: main = right arm (17,-6), weapons = shoulders (+-20,3), support = backpack (0,19), special (0,11).
     Groups: "foot_l" / "foot_r" step forward and back; "stock_arms" is hidden when gear is fitted. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Feet: long boots under the body; only the toes and heels show, and they swap as it walks -->
<g id="foot_l">
  <path d="M-15.5,-14 L-9,-14 L-8.5,12 L-16,12 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-15.5,-14 L-9,-14 L-8.5,12 L-16,12 Z" fill="#2f6f9e"/>
  <path d="M-12,-14 L-9,-14 L-8.5,12 L-11.5,12 Z" fill="#1d4a6e"/>
  <path d="M-15,-13.3 L-10,-13.3" stroke="#8fd3f5" stroke-width="1"/>
  <rect x="-14.6" y="-12.6" width="4.4" height="2" rx="0.6" fill="#ffc759"/>
</g>
<g id="foot_r">
  <path d="M9,-14 L15.5,-14 L16,12 L8.5,12 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M9,-14 L15.5,-14 L16,12 L8.5,12 Z" fill="#26608c"/>
  <path d="M12.5,-14 L15.5,-14 L16,12 L12,12 Z" fill="#1a4262"/>
  <rect x="10.2" y="-12.6" width="4.4" height="2" rx="0.6" fill="#ffc759"/>
</g>

<!-- Backpack and its twin thrusters (the support mount) -->
<g>
  <path d="M-9,8 L9,8 L8,19 L-8,19 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-9,8 L9,8 L8,19 L-8,19 Z" fill="#3a8cc4"/>
  <path d="M1,8 L9,8 L8,19 L1,19 Z" fill="#2a6ea3"/>
  <path d="M-8.6,8.8 L-7.8,18.2" stroke="#9fdcfa" stroke-width="1"/>
  <path d="M-6.5,11 L-2,11 M-6.5,13.5 L-2,13.5 M2,11 L6.5,11 M2,13.5 L6.5,13.5" stroke="#16314f" stroke-width="1"/>
  <path d="M-6.5,19 L-6,22 L-2.4,22 L-2,19 Z M2,19 L2.4,22 L6,22 L6.5,19 Z" fill="#1a2433" stroke="#0a1628" stroke-width="0.9"/>
  <path d="M-5.2,21.4 L-3.2,21.4 M3.2,21.4 L5.2,21.4" stroke="#ffb347" stroke-width="1.3"/>
</g>

<!-- Stock arms, shown only with no gear fitted: a long cannon on the right, a blade emitter on the left -->
<g id="stock_arms">
  <path d="M15,-2 L15,-27 L20,-27 L20,-2 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M15,-2 L15,-27 L20,-27 L20,-2 Z" fill="#33536e"/>
  <path d="M17.8,-2 L17.8,-27 L20,-27 L20,-2 Z" fill="#223a50"/>
  <path d="M15.7,-26 L15.7,-4" stroke="#8fb9d8" stroke-width="0.9"/>
  <rect x="14.2" y="-30" width="6.6" height="3.6" rx="0.8" fill="#1a2433" stroke="#0a1628" stroke-width="1"/>
  <circle cx="17.5" cy="-30" r="1.6" fill="#d6fbff"/>
  <path d="M-20,-13 L-14,-13 L-14,-1 L-20,-1 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-20,-13 L-14,-13 L-14,-1 L-20,-1 Z" fill="#3a8cc4"/>
  <path d="M-16.4,-13 L-14,-13 L-14,-1 L-16.4,-1 Z" fill="#2a6ea3"/>
  <path d="M-19,-16 L-15,-16" stroke="#7ff3ff" stroke-width="2.6"/>
  <path d="M-18.4,-16 L-15.6,-16" stroke="#eaffff" stroke-width="1"/>
</g>

<!-- Torso: a broad chest plate, its point toward the aim -->
<g>
  <path d="M0,-14 L12,-8 L11,9 L0,11 L-11,9 L-12,-8 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <path d="M0,-14 L12,-8 L11,9 L0,11 L-11,9 L-12,-8 Z" fill="#56bdf2"/>
  <path d="M0.8,-13.4 L12,-8 L11,9 L0.8,10.8 Z" fill="#3384c0"/>
  <path d="M-11,4 L-11,9 L0,11 L11,9 L11,4 L0,6.4 Z" fill="#2a74ad" opacity="0.85"/>
  <path d="M-1,-12.6 L-10.8,-7.8 L-10.2,1 L-8.6,1 L-9.2,-7 Z" fill="#bdeeff"/>
  <path d="M-10.5,1.5 L10.5,1.5" stroke="#1f5b8e" stroke-width="0.9"/>
  <path d="M-6,4 L-3,7 M6,4 L3,7" stroke="#ffc759" stroke-width="1.4"/>
</g>

<!-- Shoulder pauldrons: angled plates trimmed in gold (the weapon mounts) -->
<g id="shoulders">
  <path d="M-11,-10 L-21,-7 L-22,5 L-12,7 Z M11,-10 L21,-7 L22,5 L12,7 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <path d="M-11,-10 L-21,-7 L-22,5 L-12,7 Z" fill="#4aaee6"/>
  <path d="M11,-10 L21,-7 L22,5 L12,7 Z" fill="#2f7cb6"/>
  <path d="M-12,1.5 L-22,2 L-22,5 L-12,7 Z" fill="#2e86c2"/>
  <path d="M12,0.5 L22,1 L22,5 L12,7 Z" fill="#23649d"/>
  <path d="M-11.4,-9.4 L-20.6,-6.6" stroke="#c4f0ff" stroke-width="1.2"/>
  <path d="M-12.2,-7.2 L-19.6,-5 L-20.4,3" stroke="#ffc759" stroke-width="1.7" fill="none"/>
  <path d="M12.2,-7.2 L19.6,-5 L20.4,3" stroke="#d9a043" stroke-width="1.7" fill="none"/>
</g>

<!-- Helmet, seen from above: the visor strip on its leading edge shows where it looks; the gold crest
     fins sweep back from the brow -->
<g id="helmet">
  <path d="M0,-12 C4.4,-12 6,-8 6,-4 C6,1 3.5,3 0,3 C-3.5,3 -6,1 -6,-4 C-6,-8 -4.4,-12 0,-12 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M0,-12 C4.4,-12 6,-8 6,-4 C6,1 3.5,3 0,3 C-3.5,3 -6,1 -6,-4 C-6,-8 -4.4,-12 0,-12 Z" fill="#4fb4ea"/>
  <path d="M0.6,-11.9 C4.6,-11.6 6,-8 6,-4 C6,1 3.5,3 0.6,3 Z" fill="#2f7cb6"/>
  <path d="M-4.6,-6 C-4.4,-9 -3,-10.6 -0.8,-11" stroke="#d4f4ff" stroke-width="1.2" fill="none"/>
  <!-- visor: a bright band across the front of the helmet -->
  <path d="M-4.6,-9.6 C-2.4,-11.4 2.4,-11.4 4.6,-9.6 L4,-8 C2,-9.4 -2,-9.4 -4,-8 Z" fill="#9ff6ff"/>
  <!-- crest: two gold fins sweeping back from the brow -->
  <path d="M0,-9 L-5.5,-2 L-4,-1.2 L0,-6.4 L4,-1.2 L5.5,-2 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.2"/>
  <path d="M0,-9 L-5.5,-2 L-4,-1.2 L0,-6.4 Z" fill="#ffc759"/>
  <path d="M0,-9 L5.5,-2 L4,-1.2 L0,-6.4 Z" fill="#d9a043"/>
</g>

</g>
</svg>
