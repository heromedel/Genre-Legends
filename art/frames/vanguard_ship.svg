<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Vanguard, ship form, facing up. Game units. Light from the top-left. Gear mounts: main (0,-24), pylons (+-17,6),
     support (0,15), special (0,-4). Group "flame" is stretched by thrust.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Engine flame -->
<g id="flame">
<path d="M-5,20 L-3,31 L-1,20 Z M1,20 L3,31 L5,20 Z" fill="#ff9a3c" opacity="0.9"/>
<path d="M-4,20 L-3,26.5 L-2,20 Z M2,20 L3,26.5 L4,20 Z" fill="#fff1c4"/>
</g>

<!-- Tail fins -->
<g>
  <path d="M-4,8 L-9,20 L-5.5,20.5 L-3,14 Z M4,8 L9,20 L5.5,20.5 L3,14 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-4,8 L-9,20 L-5.5,20.5 L-3,14 Z" fill="#3e9fd8"/>
  <path d="M4,8 L9,20 L5.5,20.5 L3,14 Z" fill="#2a78b2"/>
  <path d="M-4,8 L-9,20" stroke="#a9e6ff" stroke-width="0.8" fill="none"/>
  <path d="M-5.5,15 L-7,19" stroke="#ffc759" stroke-width="1.2" fill="none"/>
  <path d="M5.5,15 L7,19" stroke="#c98a2a" stroke-width="1.2" fill="none"/>
</g>

<!-- Wings -->
<g>
  <!-- 1 outline -->
  <path d="M-4,-7 L-24,6 L-27.5,13 L-22,15.5 L-7,12 Z M4,-7 L24,6 L27.5,13 L22,15.5 L7,12 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <!-- 2 fill: the lit wing is brighter than the one turned from the light -->
  <path d="M-4,-7 L-24,6 L-27.5,13 L-22,15.5 L-7,12 Z" fill="#46acE6"/>
  <path d="M4,-7 L24,6 L27.5,13 L22,15.5 L7,12 Z" fill="#3590cc"/>
  <!-- 3 shading: trailing edges fall into shadow -->
  <path d="M-7,7 L-25.5,11 L-22,15.5 L-7,12 Z" fill="#2e86c2"/>
  <path d="M7,4 L24,6 L27.5,13 L22,15.5 L7,12 Z" fill="#23649d"/>
  <!-- 4 highlights: leading edges catch the light -->
  <path d="M-4.5,-6 L-23.5,6.3" stroke="#bdeeff" stroke-width="1.1" fill="none"/>
  <path d="M4.5,-6 L23.5,6.3" stroke="#7fcbef" stroke-width="0.6" fill="none"/>
  <!-- 5 details: gold trim, panel seams, missile rails, nav lights -->
  <path d="M-8,0 L-20,8" stroke="#ffc759" stroke-width="2" fill="none"/>
  <path d="M-8.3,1.1 L-19.6,8.6" stroke="#c98a2a" stroke-width="0.6" fill="none"/>
  <path d="M8,0 L20,8" stroke="#d9a043" stroke-width="2" fill="none"/>
  <path d="M-9,10.5 L-21,13.2 M9,10.5 L21,13.2" stroke="#1f5b8e" stroke-width="0.9" fill="none"/>
  <rect x="-18.6" y="8.6" width="5" height="1.6" rx="0.5" fill="#16314f"/>
  <rect x="13.6" y="8.6" width="5" height="1.6" rx="0.5" fill="#16314f"/>
  <circle cx="-25.6" cy="12.4" r="1.7" fill="#ff5a5a"/>
  <circle cx="25.6" cy="12.4" r="1.7" fill="#5aff9a"/>
</g>

<!-- Side intakes -->
<g>
  <path d="M-5.5,-5 L-9.5,-2 L-9.5,10 L-5.5,12 Z M5.5,-5 L9.5,-2 L9.5,10 L5.5,12 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2"/>
  <path d="M-5.5,-5 L-9.5,-2 L-9.5,10 L-5.5,12 Z" fill="#3a9bd3"/>
  <path d="M5.5,-5 L9.5,-2 L9.5,10 L5.5,12 Z" fill="#26679f"/>
  <path d="M-9.5,-2 L-9.5,10" stroke="#9fdcfa" stroke-width="0.7"/>
  <path d="M-8.6,-1.2 L-6.4,-3 L-6.4,1 L-8.6,2.4 Z" fill="#0f243b"/>
  <path d="M8.6,-1.2 L6.4,-3 L6.4,1 L8.6,2.4 Z" fill="#0f243b"/>
  <path d="M-8.4,5 L-6.6,5 M-8.4,6.6 L-6.6,6.6 M-8.4,8.2 L-6.6,8.2 M6.6,5 L8.4,5 M6.6,6.6 L8.4,6.6 M6.6,8.2 L8.4,8.2" stroke="#16314f" stroke-width="0.6"/>
</g>

<!-- Fuselage -->
<g>
  <!-- 1 outline -->
  <path d="M0,-31 L-3,-24 L-5,-12 L-6,0 L-6,12 L-5,19 L5,19 L6,12 L6,0 L5,-12 L3,-24 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <!-- 2 fill -->
  <path d="M0,-31 L-3,-24 L-5,-12 L-6,0 L-6,12 L-5,19 L5,19 L6,12 L6,0 L5,-12 L3,-24 Z" fill="#5cc4f8"/>
  <!-- 3 shading: the right flank and the tail -->
  <path d="M0.8,-29 L3,-24 L5,-12 L6,0 L6,12 L5,19 L1.2,19 L1.6,0 Z" fill="#3384c0"/>
  <path d="M-5.5,14 L-5,19 L5,19 L5.5,14 Z" fill="#2a74ad" opacity="0.8"/>
  <!-- 4 highlights: a long sheen down the lit flank, a glint at the nose -->
  <path d="M-1.6,-26 L-3.6,-13 L-4.4,2 L-3,2 L-2.3,-13 Z" fill="#c4f0ff"/>
  <circle cx="-0.6" cy="-27.5" r="0.9" fill="#ffffff"/>
  <!-- 5 details: gold chevron, panel seams, spine, vents, engine bells -->
  <path d="M-3.4,-19 L0,-16.2 L3.4,-19" stroke="#ffc759" stroke-width="1.5" fill="none"/>
  <path d="M-5.6,-4 L5.6,-4 M-5.8,9 L5.8,9" stroke="#1f5b8e" stroke-width="0.8"/>
  <rect x="-4.4" y="11" width="3" height="5" rx="0.6" fill="#16314f"/>
  <rect x="1.4" y="11" width="3" height="5" rx="0.6" fill="#16314f"/>
  <path d="M-3.9,12.2 L-1.9,12.2 M-3.9,13.6 L-1.9,13.6 M-3.9,15 L-1.9,15 M1.9,12.2 L3.9,12.2 M1.9,13.6 L3.9,13.6 M1.9,15 L3.9,15" stroke="#3384c0" stroke-width="0.45"/>
  <path d="M-5,19 L-4.6,21 L-1.4,21 L-1,19 Z M1,19 L1.4,21 L4.6,21 L5,19 Z" fill="#1a2433" stroke="#0a1628" stroke-width="0.8"/>
  <path d="M-4,20.4 L-2,20.4 M2,20.4 L4,20.4" stroke="#ffb347" stroke-width="1"/>
</g>

<!-- Cockpit canopy -->
<g>
  <path d="M0,-22.5 C2.9,-20 3,-13.5 0,-10.5 C-3,-13.5 -2.9,-20 0,-22.5 Z" fill="#0a1628" stroke="#0a1628" stroke-width="1.8"/>
  <path d="M0,-22.5 C2.9,-20 3,-13.5 0,-10.5 C-3,-13.5 -2.9,-20 0,-22.5 Z" fill="#163a58"/>
  <path d="M0.4,-21.6 C2.6,-19 2.5,-14 0.2,-11.4 C1,-14.5 1.2,-18.5 0.4,-21.6 Z" fill="#2f7fb0"/>
  <path d="M-1.6,-19.8 C-1.9,-17.6 -1.7,-15.6 -1.1,-14.2" stroke="#d9f6ff" stroke-width="0.9" fill="none"/>
  <circle cx="-0.9" cy="-20.6" r="0.55" fill="#ffffff"/>
</g>

</g>
</svg>
