<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Bulwark, mech form, seen from directly above, facing up: wide, slab-armoured, a curved shield plate up front.
     Game units. Light from the top-left. Each component: outline, fill, shading, highlights, details.
     Gear mounts: main = right arm (17,-6), weapons = shoulders (+-20,3), support = backpack (0,19), special (0,11).
     Groups: "foot_l" / "foot_r" step; "stock_arms" is hidden when gear is fitted. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Feet: wide, heavy treads -->
<g id="foot_l">
  <path d="M-19,-15 L-10,-15 L-10,13 L-19,13 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M-19,-15 L-10,-15 L-10,13 L-19,13 Z" fill="#a8541d"/>
  <path d="M-14,-15 L-10,-15 L-10,13 L-14,13 Z" fill="#7a3a12"/>
  <path d="M-18.6,-11 L-10.4,-11 M-18.6,-7 L-10.4,-7" stroke="#5a2a0c" stroke-width="1.2"/>
  <rect x="-17.8" y="-14" width="5" height="2" rx="0.6" fill="#99d9ff"/>
</g>
<g id="foot_r">
  <path d="M10,-15 L19,-15 L19,13 L10,13 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M10,-15 L19,-15 L19,13 L10,13 Z" fill="#94491a"/>
  <path d="M15,-15 L19,-15 L19,13 L15,13 Z" fill="#6a3210"/>
  <path d="M10.4,-11 L18.6,-11 M10.4,-7 L18.6,-7" stroke="#5a2a0c" stroke-width="1.2"/>
  <rect x="11.2" y="-14" width="5" height="2" rx="0.6" fill="#99d9ff"/>
</g>

<!-- Backpack: a big reactor block -->
<g>
  <path d="M-11,8 L11,8 L10,20 L-10,20 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M-11,8 L11,8 L10,20 L-10,20 Z" fill="#d97a34"/>
  <path d="M1,8 L11,8 L10,20 L1,20 Z" fill="#a8541d"/>
  <path d="M-10.4,9 L-9.6,19" stroke="#ffc58f" stroke-width="1"/>
  <circle cx="-4.5" cy="14" r="2.6" fill="#241a14"/><circle cx="4.5" cy="14" r="2.6" fill="#241a14"/>
  <circle cx="-4.5" cy="14" r="1.4" fill="#99d9ff"/><circle cx="4.5" cy="14" r="1.4" fill="#6fa8cc"/>
</g>

<!-- Stock arms: a short heavy cannon on the right, a fist on the left -->
<g id="stock_arms">
  <path d="M14.5,-2 L14.5,-24 L21,-24 L21,-2 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M14.5,-2 L14.5,-24 L21,-24 L21,-2 Z" fill="#5a4436"/>
  <path d="M18,-2 L18,-24 L21,-24 L21,-2 Z" fill="#3e2e24"/>
  <rect x="13.6" y="-27" width="8.4" height="4" rx="1" fill="#241a14" stroke="#2a1206" stroke-width="1"/>
  <circle cx="17.8" cy="-27" r="1.8" fill="#d6fbff"/>
  <path d="M-21,-12 L-14,-12 L-14,-1 L-21,-1 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M-21,-12 L-14,-12 L-14,-1 L-21,-1 Z" fill="#d97a34"/>
  <path d="M-17,-12 L-14,-12 L-14,-1 L-17,-1 Z" fill="#a8541d"/>
</g>

<!-- Torso: a wide slab -->
<g>
  <path d="M-13,-9 L13,-9 L13,9 L0,12 L-13,9 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.6"/>
  <path d="M-13,-9 L13,-9 L13,9 L0,12 L-13,9 Z" fill="#ff9e4d"/>
  <path d="M1,-9 L13,-9 L13,9 L1,11.8 Z" fill="#c9692a"/>
  <path d="M-12.6,-8.4 L-12.6,2" stroke="#ffd8b0" stroke-width="1.3"/>
  <path d="M-12.6,2 L12.6,2" stroke="#8a4316" stroke-width="1"/>
  <circle cx="-8" cy="6" r="1.2" fill="#7a3a12"/><circle cx="8" cy="6" r="1.2" fill="#5a2a0c"/>
</g>

<!-- Shoulders: huge slabs, set high -->
<g>
  <path d="M-12,-11 L-24,-9 L-24,6 L-12,8 Z M12,-11 L24,-9 L24,6 L12,8 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.6"/>
  <path d="M-12,-11 L-24,-9 L-24,6 L-12,8 Z" fill="#f08a3c"/>
  <path d="M12,-11 L24,-9 L24,6 L12,8 Z" fill="#b85e22"/>
  <path d="M-12,2 L-24,2 L-24,6 L-12,8 Z" fill="#b85e22"/>
  <path d="M-12.4,-10.4 L-23.4,-8.6 L-23.4,0" stroke="#ffd2a6" stroke-width="1.3" fill="none"/>
  <path d="M-14,-5 L-22,-4 M14,-5 L22,-4" stroke="#99d9ff" stroke-width="2"/>
</g>

<!-- Shield plate: a curved slab carried ahead of the chest, the Bulwark's signature -->
<g>
  <path d="M-13,-15 C-6,-21 6,-21 13,-15 L11,-11 C5,-16 -5,-16 -11,-11 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.4"/>
  <path d="M-13,-15 C-6,-21 6,-21 13,-15 L11,-11 C5,-16 -5,-16 -11,-11 Z" fill="#ffb26b"/>
  <path d="M0.5,-19.5 C6,-19.2 10,-17.4 13,-15 L11,-11 C8,-13.6 4.4,-15.2 0.5,-15.8 Z" fill="#d97a34"/>
  <path d="M-12,-15.2 C-6,-20 -1,-20.2 0,-20.2" stroke="#ffe3c7" stroke-width="1.2" fill="none"/>
  <path d="M-5,-17.6 L5,-17.6" stroke="#99d9ff" stroke-width="1.8"/>
</g>

<!-- Helmet: low and armoured, sunk between the shoulders; a narrow visor slit at the front -->
<g>
  <path d="M-5.5,-9 L5.5,-9 L6,-1 L-6,-1 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2"/>
  <path d="M-5.5,-9 L5.5,-9 L6,-1 L-6,-1 Z" fill="#e08840"/>
  <path d="M0.5,-9 L5.5,-9 L6,-1 L0.5,-1 Z" fill="#a8541d"/>
  <path d="M-4.6,-8 L4.6,-8" stroke="#9ff6ff" stroke-width="1.6"/>
</g>

</g>
</svg>
