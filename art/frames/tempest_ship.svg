<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Tempest, ship form, facing up: a needle racer with forward canards. Game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front.
     Gear mounts: main (0,-24), pylons (+-17,6), support (0,15), special (0,-4). Group "flame" is stretched by thrust. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- One big engine flame -->
<g id="flame">
  <path d="M-3.4,18 L0,32 L3.4,18 Z" fill="#c873ff" opacity="0.85"/>
  <path d="M-1.8,18 L0,26 L1.8,18 Z" fill="#fbe8ff"/>
</g>

<!-- Tail fins, swept hard back -->
<g>
  <path d="M-3.5,6 L-13,20 L-8,20.5 L-3,14 Z M3.5,6 L13,20 L8,20.5 L3,14 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M-3.5,6 L-13,20 L-8,20.5 L-3,14 Z" fill="#6fe8a0"/>
  <path d="M3.5,6 L13,20 L8,20.5 L3,14 Z" fill="#3fae72"/>
  <path d="M-3.8,7 L-12.4,19.6" stroke="#d6ffe6" stroke-width="1"/>
  <path d="M-6,15 L-10,19.6" stroke="#f266ff" stroke-width="1.5"/>
  <path d="M6,15 L10,19.6" stroke="#b44ac0" stroke-width="1.5"/>
</g>

<!-- Main wings: long blades swept back from the waist (the pylon mounts sit on them) -->
<g>
  <path d="M-3,-2 L-21,10 L-21,13 L-4,9 Z M3,-2 L21,10 L21,13 L4,9 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M-3,-2 L-21,10 L-21,13 L-4,9 Z" fill="#6fe8a0"/>
  <path d="M3,-2 L21,10 L21,13 L4,9 Z" fill="#45b97b"/>
  <path d="M-4,7 L-21,11.4 L-21,13 L-4,9 Z" fill="#46b67a"/>
  <path d="M-3.4,-1.2 L-20.4,9.8" stroke="#d6ffe6" stroke-width="1"/>
  <path d="M-8,3.5 L-17,9.4" stroke="#f266ff" stroke-width="1.8"/>
  <path d="M8,3.5 L17,9.4" stroke="#b44ac0" stroke-width="1.8"/>
</g>

<!-- Canards: small forward wings, the Tempest's signature -->
<g>
  <path d="M-3,-14 L-15,-17 L-16,-12.5 L-3.5,-8 Z M3,-14 L15,-17 L16,-12.5 L3.5,-8 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-3,-14 L-15,-17 L-16,-12.5 L-3.5,-8 Z" fill="#7ff2ae"/>
  <path d="M3,-14 L15,-17 L16,-12.5 L3.5,-8 Z" fill="#4cc283"/>
  <path d="M-3.4,-13.4 L-14.6,-16.4" stroke="#e0ffec" stroke-width="1"/>
  <circle cx="-14.8" cy="-14.6" r="1.6" fill="#f266ff"/>
  <circle cx="14.8" cy="-14.6" r="1.6" fill="#f266ff"/>
</g>

<!-- Fuselage: long and narrow -->
<g>
  <path d="M0,-35 L-2.6,-26 L-4,-12 L-4.4,4 L-4,17 L4,17 L4.4,4 L4,-12 L2.6,-26 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.4"/>
  <path d="M0,-35 L-2.6,-26 L-4,-12 L-4.4,4 L-4,17 L4,17 L4.4,4 L4,-12 L2.6,-26 Z" fill="#8cffb3"/>
  <path d="M0.7,-33 L2.6,-26 L4,-12 L4.4,4 L4,17 L1,17 L1.2,0 Z" fill="#4cc283"/>
  <path d="M-4,12 L-4,17 L4,17 L4,12 Z" fill="#3a9e66" opacity="0.8"/>
  <path d="M-1.3,-30 L-3,-14 L-3.4,2 L-2.2,2 L-1.8,-14 Z" fill="#e6fff0"/>
  <path d="M-4.2,-2 L4.2,-2 M-4.2,8 L4.2,8" stroke="#2b7d52" stroke-width="0.9"/>
  <path d="M-2.6,-22 L0,-19.6 L2.6,-22" stroke="#f266ff" stroke-width="1.6" fill="none"/>
  <path d="M-3.4,17 L-3,19 L3,19 L3.4,17 Z" fill="#14261d" stroke="#0a1f16" stroke-width="0.9"/>
  <path d="M-2,18.4 L2,18.4" stroke="#e7a6ff" stroke-width="1.2"/>
</g>

<!-- Canopy: long and slim, tinted -->
<g>
  <path d="M0,-25 C2,-22 2.2,-15 0,-12 C-2.2,-15 -2,-22 0,-25 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="1.6"/>
  <path d="M0,-25 C2,-22 2.2,-15 0,-12 C-2.2,-15 -2,-22 0,-25 Z" fill="#2a1a3a"/>
  <path d="M0.3,-24 C1.9,-21 1.8,-15.6 0.2,-13 C0.8,-16 0.9,-20.5 0.3,-24 Z" fill="#7a3a96"/>
  <path d="M-1,-22 C-1.2,-19.6 -1.1,-17.4 -0.7,-16" stroke="#f6d8ff" stroke-width="0.9" fill="none"/>
</g>

</g>
</svg>
