<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Tempest, mech form, seen from directly above, facing up: slim and quick, with swept fins off its back.
     Game units. Light from the top-left. Each component: outline, fill, shading, highlights, details.
     Gear mounts: main = right arm (17,-6), weapons = shoulders (+-20,3), support = backpack (0,19), special (0,11).
     Groups: "foot_l" / "foot_r" step; "stock_arms" is hidden when gear is fitted. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Jet fins off the backpack, swept back with a thruster at each tip: the Tempest's signature -->
<g>
  <path d="M-5,10 L-15,17 L-14,21 L-4,15 Z M5,10 L15,17 L14,21 L4,15 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M-5,10 L-15,17 L-14,21 L-4,15 Z" fill="#c45ad6"/>
  <path d="M5,10 L15,17 L14,21 L4,15 Z" fill="#8f3a9e"/>
  <path d="M-5.4,10.8 L-14.4,17.2" stroke="#f9c4ff" stroke-width="1"/>
  <circle cx="-14.6" cy="20.6" r="1.8" fill="#e7a6ff"/><circle cx="14.6" cy="20.6" r="1.8" fill="#e7a6ff"/>
</g>

<!-- Feet: slim boots -->
<g id="foot_l">
  <path d="M-13,-12 L-8,-12 L-7.6,10 L-13.4,10 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-13,-12 L-8,-12 L-7.6,10 L-13.4,10 Z" fill="#3fae72"/>
  <path d="M-10.4,-12 L-8,-12 L-7.6,10 L-10,10 Z" fill="#2b7d52"/>
  <rect x="-12.4" y="-10.8" width="3.6" height="1.8" rx="0.6" fill="#f266ff"/>
</g>
<g id="foot_r">
  <path d="M8,-12 L13,-12 L13.4,10 L7.6,10 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M8,-12 L13,-12 L13.4,10 L7.6,10 Z" fill="#348f5f"/>
  <path d="M10.6,-12 L13,-12 L13.4,10 L10.2,10 Z" fill="#246a46"/>
  <rect x="8.8" y="-10.8" width="3.6" height="1.8" rx="0.6" fill="#f266ff"/>
</g>

<!-- Backpack: a single slim thruster -->
<g>
  <path d="M-6,7 L6,7 L5,18 L-5,18 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M-6,7 L6,7 L5,18 L-5,18 Z" fill="#6fe8a0"/>
  <path d="M0.8,7 L6,7 L5,18 L0.8,18 Z" fill="#3fae72"/>
  <path d="M-3.5,18 L-3,21.4 L3,21.4 L3.5,18 Z" fill="#14261d" stroke="#0a1f16" stroke-width="0.9"/>
  <path d="M-2,20.8 L2,20.8" stroke="#e7a6ff" stroke-width="1.4"/>
</g>

<!-- Stock arms: a long needle rifle on the right, a blade on the left -->
<g id="stock_arms">
  <path d="M15.5,-2 L15.5,-29 L19,-29 L19,-2 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M15.5,-2 L15.5,-29 L19,-29 L19,-2 Z" fill="#2f5a46"/>
  <path d="M17.4,-2 L17.4,-29 L19,-29 L19,-2 Z" fill="#1f3d2f"/>
  <circle cx="17.2" cy="-30.4" r="1.5" fill="#f9c4ff"/>
  <path d="M-18.5,-12 L-14,-12 L-14,-1 L-18.5,-1 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-18.5,-12 L-14,-12 L-14,-1 L-18.5,-1 Z" fill="#6fe8a0"/>
  <path d="M-17.8,-15 L-14.7,-15" stroke="#f266ff" stroke-width="2.4"/>
</g>

<!-- Torso: narrow, pointed -->
<g>
  <path d="M0,-14 L9,-8 L8.4,8 L0,10 L-8.4,8 L-9,-8 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.4"/>
  <path d="M0,-14 L9,-8 L8.4,8 L0,10 L-8.4,8 L-9,-8 Z" fill="#8cffb3"/>
  <path d="M0.8,-13.4 L9,-8 L8.4,8 L0.8,9.8 Z" fill="#4cc283"/>
  <path d="M-0.8,-12.8 L-8.2,-7.4 L-7.8,0 L-6.6,0 L-7,-6.8 Z" fill="#e6fff0"/>
  <path d="M-8,1 L8,1" stroke="#2b7d52" stroke-width="0.9"/>
</g>

<!-- Shoulders: light, swept plates -->
<g>
  <path d="M-8.5,-9 L-19,-5 L-19,4 L-9,6 Z M8.5,-9 L19,-5 L19,4 L9,6 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M-8.5,-9 L-19,-5 L-19,4 L-9,6 Z" fill="#7ff2ae"/>
  <path d="M8.5,-9 L19,-5 L19,4 L9,6 Z" fill="#45b97b"/>
  <path d="M-9,1 L-19,1.6 L-19,4 L-9,6 Z" fill="#4cc283"/>
  <path d="M-9,-8.4 L-18.4,-4.8" stroke="#e0ffec" stroke-width="1.1"/>
  <path d="M-10,-6 L-17.4,-3.2" stroke="#f266ff" stroke-width="1.6"/>
  <path d="M10,-6 L17.4,-3.2" stroke="#b44ac0" stroke-width="1.6"/>
</g>

<!-- Helmet from above: one long visor slit across its leading edge -->
<g>
  <path d="M0,-12 C3.6,-12 5,-8.5 5,-4.5 C5,0 3,2 0,2 C-3,2 -5,0 -5,-4.5 C-5,-8.5 -3.6,-12 0,-12 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M0,-12 C3.6,-12 5,-8.5 5,-4.5 C5,0 3,2 0,2 C-3,2 -5,0 -5,-4.5 C-5,-8.5 -3.6,-12 0,-12 Z" fill="#7ff2ae"/>
  <path d="M0.6,-11.9 C3.8,-11.6 5,-8.5 5,-4.5 C5,0 3,2 0.6,2 Z" fill="#45b97b"/>
  <path d="M-3.8,-9.8 C-1.6,-11.4 1.6,-11.4 3.8,-9.8 L3.4,-8.3 C1.6,-9.6 -1.6,-9.6 -3.4,-8.3 Z" fill="#f5a8ff"/>
  <path d="M-3.8,-5.5 C-3.6,-7.6 -2.6,-8.6 -1,-9" stroke="#e6fff0" stroke-width="1" fill="none"/>
</g>

</g>
</svg>
