<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Bulwark, ship form, facing up: a broad armoured gunship. Game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front.
     Gear mounts: main (0,-24), pylons (+-17,6), support (0,15), special (0,-4). Group "flame" is stretched by thrust. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Two heavy engine flames -->
<g id="flame">
  <path d="M-10,21 L-7.5,31 L-5,21 Z M5,21 L7.5,31 L10,21 Z" fill="#ff9a3c" opacity="0.9"/>
  <path d="M-9,21 L-7.5,26.5 L-6,21 Z M6,21 L7.5,26.5 L9,21 Z" fill="#fff1c4"/>
</g>

<!-- Block wings: thick armoured slabs -->
<g id="wings">
  <path d="M-10,-7 L-25,-3 L-28,15 L-12,17 Z M10,-7 L25,-3 L28,15 L12,17 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.6"/>
  <path d="M-10,-7 L-25,-3 L-28,15 L-12,17 Z" fill="#f08a3c"/>
  <path d="M10,-7 L25,-3 L28,15 L12,17 Z" fill="#c9692a"/>
  <path d="M-11,9 L-27,8.5 L-28,15 L-12,17 Z" fill="#b85e22"/>
  <path d="M11,7 L26.5,6.5 L28,15 L12,17 Z" fill="#8a4316"/>
  <path d="M-10.4,-6.2 L-24.4,-2.4 L-26.4,8" stroke="#ffd2a6" stroke-width="1.3" fill="none"/>
  <!-- armour plate seams and the light-blue trim bars -->
  <path d="M-18,-4.6 L-19.6,15.8 M18,-4.6 L19.6,15.8" stroke="#8a4316" stroke-width="1"/>
  <path d="M-13,1 L-23,3" stroke="#99d9ff" stroke-width="2.2"/>
  <path d="M13,1 L23,3" stroke="#6fa8cc" stroke-width="2.2"/>
  <rect x="-26.6" y="10" width="3.4" height="3.4" rx="0.8" fill="#99d9ff"/>
  <rect x="23.2" y="10" width="3.4" height="3.4" rx="0.8" fill="#6fa8cc"/>
</g>

<!-- Engine pods -->
<g>
  <path d="M-12,8 L-4,8 L-4.5,21 L-11.5,21 Z M4,8 L12,8 L11.5,21 L4.5,21 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.2"/>
  <path d="M-12,8 L-4,8 L-4.5,21 L-11.5,21 Z" fill="#d97a34"/>
  <path d="M4,8 L12,8 L11.5,21 L4.5,21 Z" fill="#a8541d"/>
  <path d="M-11.6,9 L-11.2,20" stroke="#ffc58f" stroke-width="1"/>
  <path d="M-11,14 L-5,14 M5,14 L11,14" stroke="#7a3a12" stroke-width="1"/>
  <path d="M-10.5,21 L-10,23 L-5,23 L-4.5,21 Z M4.5,21 L5,23 L10,23 L10.5,21 Z" fill="#241a14" stroke="#2a1206" stroke-width="0.9"/>
  <path d="M-9,22.4 L-6,22.4 M6,22.4 L9,22.4" stroke="#ffb347" stroke-width="1.2"/>
</g>

<!-- Hull: a wide armoured body with a blunt prow -->
<g>
  <path d="M0,-25 L-7,-21 L-10,-8 L-9,18 L9,18 L10,-8 L7,-21 Z" fill="#2a1206" stroke="#2a1206" stroke-width="2.6"/>
  <path d="M0,-25 L-7,-21 L-10,-8 L-9,18 L9,18 L10,-8 L7,-21 Z" fill="#ff9e4d"/>
  <path d="M1,-24.4 L7,-21 L10,-8 L9,18 L1.5,18 Z" fill="#c9692a"/>
  <path d="M-9.2,12 L-9,18 L9,18 L9.2,12 Z" fill="#a8541d" opacity="0.8"/>
  <path d="M-1.2,-23.4 L-6.2,-20.4 L-8.6,-8 L-7.2,-8 L-5,-19.4 Z" fill="#ffd8b0"/>
  <!-- prow armour plate and its seams -->
  <path d="M-7,-21 L0,-15 L7,-21" stroke="#8a4316" stroke-width="1.2" fill="none"/>
  <path d="M-9.6,2 L9.6,2 M-9.4,10 L9.4,10" stroke="#8a4316" stroke-width="1"/>
  <path d="M-5,-12 L5,-12" stroke="#99d9ff" stroke-width="2"/>
  <circle cx="-6" cy="6" r="1.2" fill="#7a3a12"/><circle cx="6" cy="6" r="1.2" fill="#7a3a12"/>
</g>

<!-- Cockpit: a small armoured slit -->
<g>
  <path d="M-4,-9 L4,-9 L3,-3 L-3,-3 Z" fill="#2a1206" stroke="#2a1206" stroke-width="1.6"/>
  <path d="M-4,-9 L4,-9 L3,-3 L-3,-3 Z" fill="#12304a"/>
  <path d="M0.5,-9 L4,-9 L3,-3 L0.5,-3 Z" fill="#2f7fb0"/>
  <path d="M-3.2,-8 L-1,-8" stroke="#d9f6ff" stroke-width="0.9"/>
</g>

</g>
</svg>
