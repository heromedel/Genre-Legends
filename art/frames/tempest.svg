<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Tempest: one set of parts that stands as a slim mech or folds into a needle racer (GDD 5E). Each part is
     drawn once around its own origin; data-pose-mech / data-pose-ship place it ("x, y, degrees, scale x, scale y",
     facing up, game units). The shoulder blades sweep back into wings, the back fins become tail fins, the
     legs fold into twin engines, the helmet's long visor becomes the canopy. Light from the top-left.
     Each part: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">

<g id="flame_l" data-pose-mech="-3.6,24,0,0.01,0.01" data-pose-ship="-3.6,24,0,1,1">
  <path d="M-2.2,0 L0,12 L2.2,0 Z" fill="#c873ff" opacity="0.85"/>
  <path d="M-1.1,0 L0,7 L1.1,0 Z" fill="#fbe8ff"/>
</g>
<g id="flame_r" data-pose-mech="3.6,24,0,0.01,0.01" data-pose-ship="3.6,24,0,1,1">
  <path d="M-2.2,0 L0,12 L2.2,0 Z" fill="#c873ff" opacity="0.85"/>
  <path d="M-1.1,0 L0,7 L1.1,0 Z" fill="#fbe8ff"/>
</g>

<!-- Back fins: swept jet fins on the mech's back; the ship's tail fins -->
<g id="fin_l" data-pose-mech="-5,11,-35,1,1" data-pose-ship="-3.5,12,-10,1,1.3">
  <path d="M0,0 L-2,13 L-6,14 L-4,2 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M0,0 L-2,13 L-6,14 L-4,2 Z" fill="#c45ad6"/>
  <path d="M-0.6,1 L-2.4,12.4" stroke="#f9c4ff" stroke-width="1"/>
</g>
<g id="fin_r" data-pose-mech="5,11,35,1,1" data-pose-ship="3.5,12,10,1,1.3">
  <path d="M0,0 L2,13 L6,14 L4,2 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M0,0 L2,13 L6,14 L4,2 Z" fill="#8f3a9e"/>
</g>

<!-- Legs: slim boots with a thruster at the heel. Ship: twin engines. -->
<g id="leg_l" data-pose-mech="-10.5,0,0,1,1" data-pose-ship="-3.6,13,0,0.65,0.75">
  <path d="M-2.6,-12 L2.6,-12 L3,9 L-3,9 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-2.6,-12 L2.6,-12 L3,9 L-3,9 Z" fill="#3fae72"/>
  <path d="M0.4,-12 L2.6,-12 L3,9 L0.4,9 Z" fill="#2b7d52"/>
  <rect x="-1.8" y="-10.8" width="3.2" height="1.8" rx="0.6" fill="#f266ff"/>
  <path d="M-2.4,9 L2.4,9 L2.9,12.5 L-2.9,12.5 Z" fill="#14261d" stroke="#0a1f16" stroke-width="0.9"/>
  <path d="M-1.8,12 L1.8,12" stroke="#e7a6ff" stroke-width="1.2"/>
</g>
<g id="leg_r" data-pose-mech="10.5,0,0,1,1" data-pose-ship="3.6,13,0,0.65,0.75">
  <path d="M-2.6,-12 L2.6,-12 L3,9 L-3,9 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-2.6,-12 L2.6,-12 L3,9 L-3,9 Z" fill="#348f5f"/>
  <path d="M0.4,-12 L2.6,-12 L3,9 L0.4,9 Z" fill="#246a46"/>
  <rect x="-1.8" y="-10.8" width="3.2" height="1.8" rx="0.6" fill="#f266ff"/>
  <path d="M-2.4,9 L2.4,9 L2.9,12.5 L-2.9,12.5 Z" fill="#14261d" stroke="#0a1f16" stroke-width="0.9"/>
  <path d="M-1.8,12 L1.8,12" stroke="#e7a6ff" stroke-width="1.2"/>
</g>

<!-- Backpack: a slim thruster pack; the ship's spine -->
<g id="backpack" data-pose-mech="0,12,0,1,1" data-pose-ship="0,8,0,0.7,1.3">
  <path d="M-6,-5 L6,-5 L5,6 L-5,6 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-6,-5 L6,-5 L5,6 L-5,6 Z" fill="#6fe8a0"/>
  <path d="M0.8,-5 L6,-5 L5,6 L0.8,6 Z" fill="#3fae72"/>
</g>

<!-- Stock arms: a long needle rifle and a blade; the ship's nose guns -->
<g id="arm_r" data-pose-mech="16.5,-14,0,1,1" data-pose-ship="5,-12,0,0.55,0.6">
  <path d="M-1.8,-16 L1.8,-16 L1.8,11 L-1.8,11 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-1.8,-16 L1.8,-16 L1.8,11 L-1.8,11 Z" fill="#2f5a46"/>
  <path d="M0.2,-16 L1.8,-16 L1.8,11 L0.2,11 Z" fill="#1f3d2f"/>
  <circle cx="0" cy="-17.4" r="1.5" fill="#f9c4ff"/>
</g>
<g id="arm_l" data-pose-mech="-16,-7,0,1,1" data-pose-ship="-5,-12,0,0.55,0.6">
  <path d="M-2.3,-5.5 L2.3,-5.5 L2.3,5.5 L-2.3,5.5 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M-2.3,-5.5 L2.3,-5.5 L2.3,5.5 L-2.3,5.5 Z" fill="#6fe8a0"/>
  <path d="M-1.6,-8.5 L1.6,-8.5" stroke="#f266ff" stroke-width="2.4"/>
</g>

<!-- Shoulder blades: light swept plates. Ship: long wings swept back from the waist. -->
<g id="shoulder_l" data-pose-mech="-8.5,-8,-16,0.75,1.15" data-pose-ship="-3,-1,-22,1.55,0.6">
  <g transform="scale(-1,1)">
    <path d="M0,-4 L13,0 L14,8 L1,8 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
    <path d="M0,-4 L13,0 L14,8 L1,8 Z" fill="#7ff2ae"/>
    <path d="M1,4.6 L13.4,4.8 L14,8 L1,8 Z" fill="#4cc283"/>
    <path d="M0.6,-3.2 L12.6,0.4" stroke="#e0ffec" stroke-width="1.1"/>
    <path d="M2,-0.8 L11.4,2.4" stroke="#f266ff" stroke-width="1.6"/>
  </g>
</g>
<g id="shoulder_r" data-pose-mech="8.5,-8,16,0.75,1.15" data-pose-ship="3,-1,22,1.55,0.6">
  <path d="M0,-4 L13,0 L14,8 L1,8 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2"/>
  <path d="M0,-4 L13,0 L14,8 L1,8 Z" fill="#45b97b"/>
  <path d="M1,4 L13.4,4.2 L14,8 L1,8 Z" fill="#348f5f"/>
  <path d="M2,-0.8 L11.4,2.4" stroke="#b44ac0" stroke-width="1.6"/>
</g>

<!-- Torso: narrow and pointed. Ship: a long needle fuselage. -->
<g id="torso" data-pose-mech="0,-1,0,1,1" data-pose-ship="0,-4,0,0.6,1.8">
  <path d="M0,-12 L8,-6 L7.4,8 L0,10 L-7.4,8 L-8,-6 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="2.2"/>
  <path d="M0,-12 L8,-6 L7.4,8 L0,10 L-7.4,8 L-8,-6 Z" fill="#8cffb3"/>
  <path d="M0.8,-11.4 L8,-6 L7.4,8 L0.8,9.8 Z" fill="#4cc283"/>
  <path d="M-0.8,-10.8 L-7.2,-5.4 L-6.8,1 L-5.6,1 L-6,-4.8 Z" fill="#e6fff0"/>
  <path d="M-7,1.5 L7,1.5" stroke="#2b7d52" stroke-width="0.9"/>
</g>

<!-- Helmet: one long visor slit across its front. Ship: the slim canopy. -->
<g id="helmet" data-pose-mech="0,-4,0,1,1" data-pose-ship="0,-20,0,0.6,1.7">
  <path d="M0,-7 C3.6,-7 5,-3.5 5,0.5 C5,5 3,7 0,7 C-3,7 -5,5 -5,0.5 C-5,-3.5 -3.6,-7 0,-7 Z" fill="#0a1f16" stroke="#0a1f16" stroke-width="1.8"/>
  <path d="M0,-7 C3.6,-7 5,-3.5 5,0.5 C5,5 3,7 0,7 C-3,7 -5,5 -5,0.5 C-5,-3.5 -3.6,-7 0,-7 Z" fill="#7ff2ae"/>
  <path d="M0.6,-6.9 C3.8,-6.6 5,-3.5 5,0.5 C5,5 3,7 0.6,7 Z" fill="#45b97b"/>
  <path d="M-3.8,-4.8 C-1.6,-6.4 1.6,-6.4 3.8,-4.8 L3.4,-3.3 C1.6,-4.6 -1.6,-4.6 -3.4,-3.3 Z" fill="#f5a8ff"/>
  <path d="M-3.8,-0.5 C-3.6,-2.6 -2.6,-3.6 -1,-4" stroke="#e6fff0" stroke-width="1" fill="none"/>
</g>

</g>
</svg>
