     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">
<path d="M-1.2,-14 L1.2,-14 L1.2,14 L-1.2,14 Z" fill="#d9ffd9"/>
<g id="half_l">
  <path d="M-2,-15 L-10,-12 L-15,-2 L-13,10 L-6,15 L-2,13 Z" fill="#0b2a0e" stroke="#0b2a0e" stroke-width="2.4"/>
  <path d="M-2,-15 L-10,-12 L-15,-2 L-13,10 L-6,15 L-2,13 Z" fill="#7fe07f"/>
  <path d="M-2,4 L-14,4 L-13,10 L-6,15 L-2,13 Z" fill="#4fae55"/>
  <path d="M-3,-13.6 L-9.4,-11 L-13.6,-2.4" stroke="#e6ffe6" stroke-width="1" fill="none"/>
  <circle cx="-8" cy="-3" r="1.6" fill="#2e7a35"/>
</g>
<g id="half_r">
  <path d="M2,-15 L10,-12 L15,-2 L13,10 L6,15 L2,13 Z" fill="#0b2a0e" stroke="#0b2a0e" stroke-width="2.4"/>
  <path d="M2,-15 L10,-12 L15,-2 L13,10 L6,15 L2,13 Z" fill="#5cc062"/>
  <path d="M2,4 L14,4 L13,10 L6,15 L2,13 Z" fill="#3a8a40"/>
  <circle cx="8" cy="-3" r="1.6" fill="#24602a"/>
</g>
</g>
</svg>
