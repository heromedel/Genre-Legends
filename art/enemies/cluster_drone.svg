<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 60 60">
<!-- Cluster Drone: four pods docked on struts around a glowing core; break it and they hunt you. Facing up (toward where it flies), nominal radius 16, game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">
<g id="pods">
  <path d="M0,-6 L0,-11 M6,0 L11,0 M0,6 L0,11 M-6,0 L-11,0" stroke="#2a0a20" stroke-width="3.4"/>
  <path d="M0,-6 L0,-11 M6,0 L11,0 M0,6 L0,11 M-6,0 L-11,0" stroke="#c87aa8" stroke-width="1.6"/>
  <path d="M0,-17 L4,-12 L0,-8 L-4,-12 Z M17,0 L12,4 L8,0 L12,-4 Z M0,17 L-4,12 L0,8 L4,12 Z M-17,0 L-12,-4 L-8,0 L-12,4 Z" fill="#2a0a20" stroke="#2a0a20" stroke-width="2.2"/>
  <path d="M0,-17 L4,-12 L0,-8 L-4,-12 Z M17,0 L12,4 L8,0 L12,-4 Z M0,17 L-4,12 L0,8 L4,12 Z M-17,0 L-12,-4 L-8,0 L-12,4 Z" fill="#f080c8"/>
  <path d="M0,-17 L4,-12 L0,-8 Z M17,0 L12,4 L8,0 Z M0,17 L-4,12 L0,8 Z M-17,0 L-12,-4 L-8,0 Z" fill="#b8508f"/>
</g>
<circle cx="0" cy="0" r="7.4" fill="#2a0a20"/><circle cx="0" cy="0" r="6" fill="#ff9ce0"/><circle cx="-1.6" cy="-1.6" r="2.2" fill="#fff0fa"/>
</g>
</svg>
