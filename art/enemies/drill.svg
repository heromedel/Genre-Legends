<g id="flame"><path d="M-4,10 L0,18 L4,10 Z" fill="#9ad9ff" opacity="0.9"/></g>
<path d="M-9,4 L9,4 L8,12 L-8,12 Z" fill="#14161c" stroke="#14161c" stroke-width="2.2"/>
<path d="M-9,4 L9,4 L8,12 L-8,12 Z" fill="#6a6e80"/>
<path d="M0.6,4 L9,4 L8,12 L0.6,12 Z" fill="#4a4d5c"/>
<path d="M0,-22 L10,4 L-10,4 Z" fill="#14161c" stroke="#14161c" stroke-width="2.4"/>
<path d="M0,-22 L-10,4 L0,4 Z" fill="#e6e6f0"/>
<path d="M0,-22 L10,4 L0,4 Z" fill="#a6a8b8"/>
<g id="bands">
  <path d="M-8.4,0 L8.4,-3 M-6.4,-6 L6.4,-9 M-4.2,-12 L4.2,-14.4 M-9.6,6 L9.6,3" stroke="#3c3f4c" stroke-width="1.4"/>
</g>
<path d="M-0.6,-19 L-9,2" stroke="#ffffff" stroke-width="1"/>
</g>
