<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
<!-- Vanguard, mech form, top-down, facing up. Game units. Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. Back to front. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- Feet: big armoured boots, peeking out from under the shoulders -->
<g>
  <path d="M-21,1 L-13,1 L-12,17 L-22,17 Z M13,1 L21,1 L22,17 L12,17 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-21,1 L-13,1 L-12,17 L-22,17 Z" fill="#2f6f9e"/>
  <path d="M13,1 L21,1 L22,17 L12,17 Z" fill="#245a84"/>
  <path d="M-15.6,1.5 L-12.6,1.5 L-12,17 L-15,17 Z M17.6,1.5 L21,1.5 L22,17 L18.6,17 Z" fill="#1d4a6e"/>
  <path d="M-21.6,8 L-21.8,16.4" stroke="#8fd3f5" stroke-width="0.8"/>
  <path d="M-21.6,12.5 L-12.4,12.5 M12.4,12.5 L21.6,12.5" stroke="#16314f" stroke-width="0.6"/>
  <rect x="-19.6" y="14" width="5" height="1.8" rx="0.5" fill="#ffc759"/>
  <rect x="14.6" y="14" width="5" height="1.8" rx="0.5" fill="#d9a043"/>
</g>

<!-- Backpack and its twin thrusters -->
<g>
  <path d="M-9,8 L9,8 L8,18 L-8,18 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-9,8 L9,8 L8,18 L-8,18 Z" fill="#3a8cc4"/>
  <path d="M1,8 L9,8 L8,18 L1,18 Z" fill="#2a6ea3"/>
  <path d="M-8.6,8.6 L-7.8,17.4" stroke="#9fdcfa" stroke-width="0.7"/>
  <path d="M-7,10.5 L-2,10.5 M-7,12 L-2,12 M-7,13.5 L-2,13.5 M2,10.5 L7,10.5 M2,12 L7,12 M2,13.5 L7,13.5" stroke="#16314f" stroke-width="0.6"/>
  <path d="M-6,18 L-5.6,21 L-2.4,21 L-2,18 Z M2,18 L2.4,21 L5.6,21 L6,18 Z" fill="#1a2433" stroke="#0a1628" stroke-width="0.8"/>
  <path d="M-5,20.6 L-3,20.6 M3,20.6 L5,20.6" stroke="#ffb347" stroke-width="1.1"/>
</g>

<!-- Right arm: the long cannon -->
<g>
  <path d="M15,-4 L15,-31 L20,-31 L20,-4 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M15,-4 L15,-31 L20,-31 L20,-4 Z" fill="#33536e"/>
  <path d="M17.8,-4 L17.8,-31 L20,-31 L20,-4 Z" fill="#223a50"/>
  <path d="M15.6,-30 L15.6,-6" stroke="#8fb9d8" stroke-width="0.7"/>
  <rect x="14.2" y="-33.5" width="6.6" height="3.4" rx="0.6" fill="#1a2433" stroke="#0a1628" stroke-width="0.9"/>
  <path d="M15.6,-32 L19.4,-32" stroke="#ffc759" stroke-width="0.8"/>
  <path d="M15,-22 L20,-22 M15,-14 L20,-14" stroke="#16314f" stroke-width="0.7"/>
  <circle cx="17.5" cy="-33.4" r="1.1" fill="#d6fbff"/>
  <!-- the magazine box on the forearm -->
  <path d="M20,-14 L24,-13 L24,-5 L20,-5 Z" fill="#2a4a63" stroke="#0a1628" stroke-width="1.2"/>
  <path d="M20.6,-11 L23.4,-11" stroke="#16314f" stroke-width="0.6"/>
</g>

<!-- Left arm: the blade emitter -->
<g>
  <path d="M-20,-14 L-14,-14 L-14,-3 L-20,-3 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.2"/>
  <path d="M-20,-14 L-14,-14 L-14,-3 L-20,-3 Z" fill="#3a8cc4"/>
  <path d="M-16.4,-14 L-14,-14 L-14,-3 L-16.4,-3 Z" fill="#2a6ea3"/>
  <path d="M-19.4,-13.4 L-19.4,-4" stroke="#9fdcfa" stroke-width="0.7"/>
  <path d="M-19,-16.5 L-15,-16.5" stroke="#7ff3ff" stroke-width="2.2"/>
  <path d="M-18.4,-16.5 L-15.6,-16.5" stroke="#eaffff" stroke-width="0.9"/>
</g>

<!-- Torso: a chevron chest that points where the mech aims -->
<g>
  <path d="M0,-16 L12,-9 L11,9 L0,11 L-11,9 L-12,-9 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <path d="M0,-16 L12,-9 L11,9 L0,11 L-11,9 L-12,-9 Z" fill="#56bdf2"/>
  <path d="M0.8,-15 L12,-9 L11,9 L0.8,10.8 Z" fill="#3384c0"/>
  <path d="M-11,4 L-11,9 L0,11 L11,9 L11,4 L0,6.4 Z" fill="#2a74ad" opacity="0.85"/>
  <path d="M-1,-14.4 L-10.8,-8.6 L-10,2 L-8.6,2 L-9.2,-7.8 Z" fill="#bdeeff"/>
  <path d="M0,-15 L0,10" stroke="#1f5b8e" stroke-width="0.55"/>
  <path d="M-10.5,0 L10.5,0" stroke="#1f5b8e" stroke-width="0.5"/>
  <circle cx="-7" cy="6" r="0.6" fill="#1f5b8e"/><circle cx="7" cy="6" r="0.6" fill="#16314f"/>
</g>

<!-- Shoulder pads: angled plates trimmed in gold -->
<g>
  <path d="M-11,-10 L-21,-7 L-22,4 L-12,6 Z M11,-10 L21,-7 L22,4 L12,6 Z" fill="#0a1628" stroke="#0a1628" stroke-width="2.4"/>
  <path d="M-11,-10 L-21,-7 L-22,4 L-12,6 Z" fill="#4aaee6"/>
  <path d="M11,-10 L21,-7 L22,4 L12,6 Z" fill="#2f7cb6"/>
  <path d="M-12,1 L-22,1.5 L-22,4 L-12,6 Z" fill="#2e86c2"/>
  <path d="M12,0 L22,0.5 L22,4 L12,6 Z" fill="#23649d"/>
  <path d="M-11.4,-9.4 L-20.6,-6.6" stroke="#c4f0ff" stroke-width="1"/>
  <path d="M-12,-7.4 L-19.6,-5.2 L-20.4,2.4" stroke="#ffc759" stroke-width="1.5" fill="none"/>
  <path d="M12,-7.4 L19.6,-5.2 L20.4,2.4" stroke="#c98a2a" stroke-width="1.5" fill="none"/>
  <circle cx="-17" cy="-2" r="0.7" fill="#1f5b8e"/><circle cx="17" cy="-2" r="0.7" fill="#16314f"/>
</g>

<!-- Head: cockpit dome with the Vanguard's knightly crest -->
<g>
  <path d="M0,-11.5 L-6,-19 M0,-11.5 L6,-19" stroke="#0a1628" stroke-width="3.2"/>
  <path d="M0,-11.5 L-6,-19" stroke="#ffd36b" stroke-width="1.7"/>
  <path d="M0,-11.5 L6,-19" stroke="#d9a043" stroke-width="1.7"/>
  <circle cx="0" cy="-6" r="5" fill="#0a1628"/>
  <circle cx="0" cy="-6" r="4.1" fill="#163a58"/>
  <path d="M0.6,-9.6 A3.6,3.6 0 0 1 0.6,-2.4 A5,5 0 0 0 0.6,-9.6 Z" fill="#2f7fb0"/>
  <circle cx="0.3" cy="-5.6" r="2.3" fill="#2f9ad0" opacity="0.55"/>
  <path d="M-2.6,-7.4 A3,3 0 0 1 -1,-9.2" stroke="#d9f6ff" stroke-width="0.9" fill="none"/>
  <circle cx="-1.6" cy="-8.2" r="0.5" fill="#ffffff"/>
</g>

</g>
</svg>
