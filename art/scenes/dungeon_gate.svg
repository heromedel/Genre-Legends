<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -360 520 480">
<!-- The dungeon gate (GDD 11M): a stone arch cut into a cliff, darkness inside. The arch's opening spans
     x -110..110, y -280..-60 (the cutscene's gate). Light from the top-left.
     Each component: 1 outline, 2 fill, 3 shading, 4 highlights, 5 details. The torches' flames and the
     portcullis are drawn live. -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- The cliff face -->
<g>
  <path d="M-250,-350 L250,-350 L250,-30 L-250,-30 Z" fill="#0d0b0a" stroke="#0d0b0a" stroke-width="6"/>
  <path d="M-250,-350 L250,-350 L250,-30 L-250,-30 Z" fill="#3a3430"/>
  <path d="M40,-350 L250,-350 L250,-30 L40,-30 Z" fill="#2e2926"/>
  <path d="M-250,-80 L250,-80 L250,-30 L-250,-30 Z" fill="#26211e"/>
  <path d="M-240,-120 L-180,-160 L-140,-150 M150,-170 L210,-140 L240,-150 M-230,-260 L-190,-280 M180,-300 L230,-280" stroke="#221d1a" stroke-width="5" fill="none"/>
</g>

<!-- The arch: dressed stone blocks around the opening -->
<g>
  <path d="M-170,-60 L-170,-280 A170,170 0 0 1 170,-280 L170,-60 Z" fill="#0d0b0a" stroke="#0d0b0a" stroke-width="8"/>
  <path d="M-170,-60 L-170,-280 A170,170 0 0 1 170,-280 L170,-60 Z" fill="#5a524a"/>
  <path d="M10,-450 A170,170 0 0 1 170,-280 L170,-60 L10,-60 Z" fill="#463f39"/>
  <path d="M-164,-70 L-164,-280 A164,164 0 0 1 -40,-440" stroke="#8a7f72" stroke-width="5" fill="none"/>
  <path d="M-170,-120 L-110,-120 M110,-120 L170,-120 M-170,-190 L-110,-190 M110,-190 L170,-190 M-150,-330 L-100,-300 M150,-330 L100,-300 M-60,-430 L-40,-385 M60,-430 L40,-385" stroke="#2e2926" stroke-width="5"/>
  <!-- keystone -->
  <path d="M-22,-452 L22,-452 L16,-392 L-16,-392 Z" fill="#0d0b0a" stroke="#0d0b0a" stroke-width="5"/>
  <path d="M-22,-452 L22,-452 L16,-392 L-16,-392 Z" fill="#6e655b"/>
  <circle cx="0" cy="-420" r="8" fill="#ff7a3a"/>
</g>

<!-- The opening: darkness -->
<path d="M-110,-60 L-110,-280 A110,110 0 0 1 110,-280 L110,-60 Z" fill="#030204"/>

<!-- Torch brackets either side (the flames are drawn live above them) -->
<g>
  <path d="M-205,-200 L-185,-200 L-188,-170 L-202,-170 Z M185,-200 L205,-200 L202,-170 L188,-170 Z" fill="#0d0b0a" stroke="#0d0b0a" stroke-width="5"/>
  <path d="M-205,-200 L-185,-200 L-188,-170 L-202,-170 Z M185,-200 L205,-200 L202,-170 L188,-170 Z" fill="#6b5a44"/>
</g>

</g>
</svg>
