html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><style>html,body{background:#05080f;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}</style><script>window.glFullscreen={want:true};function glFull(){var d=document,e=d.documentElement;if(!window.glFullscreen.want||d.fullscreenElement||d.webkitFullscreenElement)return;var f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f)return;try{var p=f.call(e);if(p&&p.catch)p.catch(function(){});}catch(x){}}document.addEventListener('touchend',glFull,{passive:true});document.addEventListener('click',glFull);function glLeft(){if(!(document.fullscreenElement||document.webkitFullscreenElement))window.glFullscreen.want=false;}document.addEventListener('fullscreenchange',glLeft);document.addEventListener('webkitfullscreenchange',glLeft);</script><script>(function(){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var list=[];window.glAudio={events:[]};function note(t){window.glAudio.events.push(t);}function W(o){var c=o===undefined?new C():new C(o);list.push(c);note('audio started: '+c.state);c.addEventListener('statechange',function(){note('audio is now '+c.state);});return c;}W.prototype=C.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;function wake(){for(var i=0;i<list.length;i++){var c=list[i];if(c.state!=='running'&&c.state!=='closed'){note('audio resumed by a tap (was '+c.state+')');try{var p=c.resume();if(p&&p.catch)p.catch(function(){});}catch(x){}}}}document.addEventListener('touchend',wake,{passive:true,capture:true});document.addEventListener('mousedown',wake,true);document.addEventListener('keydown',wake,true);document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});})();</script>"
